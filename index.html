<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Інфо-простір</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-white: #ffffff;
      --color-black: #000000;
      --color-soft-orange: #ffa46e;
      --color-pink: var(--color-soft-orange);
      --color-soft-blue: #e8f1f5;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #f3f5f8;
      color: var(--color-black);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      background-color: var(--color-white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(12px, 3vh, 28px) 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }
    .game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .game-screen.hide {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }
    .header {
      text-align: center;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      font-weight: 600;
      color: var(--color-black);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header-icon {
      color: var(--color-soft-orange);
      width: clamp(18px, 4.5vw, 24px);
      height: clamp(18px, 4.5vw, 24px);
    }
    .header p {
      font-size: clamp(0.7rem, 2.8vw, 0.8rem);
      color: rgba(0, 0, 0, 0.4);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .code-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      flex-grow: 1;
    }
    .code-container {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(4px, 1.5vw, 8px);
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }
    .char-box {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background-color: var(--color-soft-blue);
      border: 1.5px solid transparent;
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .char-box.active {
      border-color: var(--color-black);
      background-color: var(--color-white);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.04);
    }
    .char-box.filled {
      border-color: var(--color-soft-orange);
      background-color: rgba(255, 164, 110, 0.1);
    }
    .char-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      font-weight: 600;
      color: var(--color-black);
      line-height: 1;
      pointer-events: none;
      transition: opacity 0.4s ease-in-out;
    }
    .char-text.ghost-letter {
      opacity: 0.35 !important;
    }
    .hint-btn {
      background-color: transparent;
      border: 1.5px solid var(--color-soft-orange);
      color: var(--color-soft-orange);
      padding: clamp(12px, 2vh, 16px) clamp(32px, 8vw, 48px);
      border-radius: 30px;
      font-size: clamp(0.75rem, 3.2vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease, opacity 0.6s ease-in-out;
      margin-top: clamp(14px, 3vh, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      align-self: center;
      width: auto;
      max-width: 90%;
    }
    .hint-btn:active {
      background-color: rgba(255, 164, 110, 0.12);
      transform: scale(0.97);
    }
    #second-hint-btn {
      display: none;
      opacity: 0;
      margin-top: clamp(8px, 1.5vh, 12px);
    }
    #second-hint-btn.show-btn {
      display: flex;
      opacity: 1;
    }
    .inline-icon {
      width: 1.25em;
      height: 1.25em;
      stroke-width: 1.8;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .keyboard-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.5vh, 10px);
      flex-shrink: 0;
    }
    .keyboard-row {
      display: flex;
      gap: clamp(6px, 1.2vw, 10px);
      width: 100%;
    }
    .key-btn {
      flex: 1;
      height: clamp(44px, 6.5vh, 54px);
      background-color: var(--color-soft-blue);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--color-black);
      font-size: clamp(0.85rem, 3.5vw, 1.1rem);
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }
    .key-btn:active {
      transform: scale(0.95);
      background-color: var(--color-soft-orange);
      color: var(--color-white);
    }
    .key-btn.key-highlight {
      background-color: var(--color-soft-orange) !important;
      border-color: var(--color-soft-orange) !important;
      color: var(--color-white) !important;
    }
    @media (hover: hover) {
      .key-btn:hover {
        background-color: rgba(0, 0, 0, 0.04);
      }
    }
    .control-key {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .clear-key {
      flex: 1;
      background-color: var(--color-white);
      color: var(--color-black);
      font-size: clamp(0.7rem, 3.2vw, 0.85rem);
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .clear-key:active {
      background-color: rgba(0, 0, 0, 0.05);
    }
    .enter-key {
      flex: 1.5;
      background-color: var(--color-soft-orange);
      font-size: clamp(0.7rem, 3.2vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;
      text-transform: uppercase;
      border: 1.5px solid var(--color-soft-orange);
      color: var(--color-white);
    }
    .enter-key:active {
      background-color: #f08e54;
      border-color: #f08e54;
    }
    .success-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--color-white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.05);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
      padding: 24px;
    }
    .success-screen.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    .success-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 600;
      color: var(--color-black);
      margin-top: clamp(24px, 5vh, 32px);
      text-align: center;
    }
    .success-subtitle {
      font-size: clamp(0.85rem, 3.8vw, 1.05rem);
      color: rgba(0, 0, 0, 0.6);
      margin-top: 12px;
      text-align: center;
      line-height: 1.6;
      max-width: 85%;
    }
    .glass-container {
      position: relative;
      width: clamp(130px, 30vh, 180px);
      height: clamp(130px, 30vh, 180px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .glass-glow {
      position: absolute;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(255, 164, 110, 0.3) 0%, rgba(255, 164, 110, 0.1) 45%, transparent 70%);
      border-radius: 50%;
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .shake {
      animation: shake-action 0.5s ease-in-out;
    }
    .error-box {
      border-color: var(--color-red) !important;
      box-shadow: 0 0 12px rgba(184, 0, 0, 0.2) !important;
    }
    @keyframes shake-action {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-8px); }
      30%, 60%, 90% { transform: translateX(8px); }
    }
    .reset-btn {
      margin-top: clamp(24px, 5vh, 40px);
      background-color: transparent;
      border: 1px solid var(--color-soft-orange);
      color: var(--color-soft-orange);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .reset-btn:active {
      background-color: rgba(255, 164, 110, 0.12);
      color: var(--color-soft-orange);
    }
    .hint-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 100;
      padding: 24px;
    }
    .hint-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .hint-content {
      background-color: var(--color-white);
      border: 1.5px solid var(--color-soft-orange);
      border-radius: 24px;
      padding: clamp(36px, 6vh, 52px) clamp(24px, 5vw, 40px);
      width: 100%;
      max-width: 340px;
      position: relative;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
      transform: translateY(20px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hint-overlay.show .hint-content {
      transform: translateY(0);
    }
    .hint-content p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.15rem, 4.8vw, 1.4rem);
      line-height: 1.6;
      color: var(--color-black);
      font-weight: 600;
      font-style: italic;
    }
    /* Autumn Falling Leaves */
    .leaf-falling {
      position: absolute;
      z-index: 4;
      filter: drop-shadow(0 0 6px rgba(255, 164, 110, 0.45));
      opacity: 0;
      pointer-events: none;
    }
    .leaf-1 {
      width: 24px;
      height: 24px;
      top: -4%;
      left: 8%;
      animation: fall-leaf-1 4s cubic-bezier(0.35, 0.1, 0.25, 1) infinite;
      animation-delay: 0s;
    }
    .leaf-2 {
      width: 22px;
      height: 22px;
      top: -6%;
      right: 12%;
      animation: fall-leaf-2 4s cubic-bezier(0.35, 0.1, 0.25, 1) infinite;
      animation-delay: 1s;
    }
    .leaf-3 {
      width: 25px;
      height: 25px;
      top: -10%;
      left: 36%;
      animation: fall-leaf-3 4s cubic-bezier(0.35, 0.1, 0.25, 1) infinite;
      animation-delay: 2s;
    }
    .leaf-4 {
      width: 20px;
      height: 20px;
      top: 0%;
      right: 4%;
      animation: fall-leaf-4 4s cubic-bezier(0.35, 0.1, 0.25, 1) infinite;
      animation-delay: 3s;
    }
    @keyframes fall-leaf-1 {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(10deg) scale(0.85);
      }
      15% {
        opacity: 0.95;
      }
      45% {
        transform: translate(16px, 55px) rotate(45deg) scale(1);
      }
      70% {
        opacity: 0.85;
      }
      82%, 100% {
        opacity: 0;
        transform: translate(-4px, 125px) rotate(85deg) scale(0.8);
      }
    }
    @keyframes fall-leaf-2 {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(-15deg) scale(0.85);
      }
      15% {
        opacity: 0.95;
      }
      45% {
        transform: translate(-18px, 60px) rotate(-45deg) scale(1);
      }
      70% {
        opacity: 0.85;
      }
      82%, 100% {
        opacity: 0;
        transform: translate(6px, 130px) rotate(30deg) scale(0.8);
      }
    }
    @keyframes fall-leaf-3 {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(20deg) scale(0.85);
      }
      15% {
        opacity: 0.95;
      }
      45% {
        transform: translate(-14px, 65px) rotate(65deg) scale(1);
      }
      70% {
        opacity: 0.85;
      }
      82%, 100% {
        opacity: 0;
        transform: translate(10px, 135px) rotate(110deg) scale(0.8);
      }
    }
    @keyframes fall-leaf-4 {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(-25deg) scale(0.85);
      }
      15% {
        opacity: 0.95;
      }
      45% {
        transform: translate(14px, 50px) rotate(20deg) scale(1);
      }
      70% {
        opacity: 0.85;
      }
      82%, 100% {
        opacity: 0;
        transform: translate(-8px, 120px) rotate(-40deg) scale(0.8);
      }
    }
    /* Autumn Raindrops */
    .raindrop {
      position: absolute;
      width: 2px;
      height: 12px;
      background: linear-gradient(180deg, rgba(140, 185, 215, 0.1) 0%, rgba(90, 145, 185, 0.8) 100%);
      border-radius: 2px;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
    }
    /* Rain hitting umbrella silhouette dome and vanishing */
    .rain-hit-1 {
      left: 50%;
      top: -8px;
      animation: rain-hit-peak 0.85s cubic-bezier(0.4, 0, 0.8, 0.5) infinite;
      animation-delay: 0.1s;
    }
    .rain-hit-2 {
      left: 44%;
      top: -6px;
      animation: rain-hit-mid-high 0.9s cubic-bezier(0.4, 0, 0.8, 0.5) infinite;
      animation-delay: 0.45s;
    }
    .rain-hit-3 {
      left: 56%;
      top: -6px;
      animation: rain-hit-mid-high 0.85s cubic-bezier(0.4, 0, 0.8, 0.5) infinite;
      animation-delay: 0.7s;
    }
    .rain-hit-4 {
      left: 36%;
      top: -4px;
      animation: rain-hit-mid 0.95s cubic-bezier(0.4, 0, 0.8, 0.5) infinite;
      animation-delay: 0.25s;
    }
    .rain-hit-5 {
      left: 64%;
      top: -4px;
      animation: rain-hit-mid 0.95s cubic-bezier(0.4, 0, 0.8, 0.5) infinite;
      animation-delay: 0.6s;
    }
    .rain-hit-6 {
      left: 28%;
      top: -2px;
      animation: rain-hit-low 1.05s cubic-bezier(0.4, 0, 0.8, 0.5) infinite;
      animation-delay: 0.35s;
    }
    .rain-hit-7 {
      left: 72%;
      top: -2px;
      animation: rain-hit-low 1.0s cubic-bezier(0.4, 0, 0.8, 0.5) infinite;
      animation-delay: 0.8s;
    }
    /* Rain surrounding umbrella and falling past along sides */
    .rain-surround-1 {
      left: 14%;
      top: -15px;
      animation: rain-fall-surround 1.25s linear infinite;
      animation-delay: 0.15s;
    }
    .rain-surround-2 {
      left: 86%;
      top: -15px;
      animation: rain-fall-surround 1.2s linear infinite;
      animation-delay: 0.5s;
    }
    .rain-surround-3 {
      left: 5%;
      top: -10px;
      animation: rain-fall-surround 1.35s linear infinite;
      animation-delay: 0.75s;
    }
    .rain-surround-4 {
      left: 95%;
      top: -10px;
      animation: rain-fall-surround 1.3s linear infinite;
      animation-delay: 0.3s;
    }
    @keyframes rain-hit-peak {
      0% {
        opacity: 0;
        transform: translateY(0) scaleY(1);
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
        transform: translateY(38px) scaleY(1);
      }
      92% {
        opacity: 0.85;
        transform: translateY(44px) scale(1.6, 0.35);
      }
      100% {
        opacity: 0;
        transform: translateY(45px) scale(2.2, 0.1);
      }
    }
    @keyframes rain-hit-mid-high {
      0% {
        opacity: 0;
        transform: translateY(0) scaleY(1);
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
        transform: translateY(44px) scaleY(1);
      }
      92% {
        opacity: 0.85;
        transform: translateY(51px) scale(1.6, 0.35);
      }
      100% {
        opacity: 0;
        transform: translateY(52px) scale(2.2, 0.1);
      }
    }
    @keyframes rain-hit-mid {
      0% {
        opacity: 0;
        transform: translateY(0) scaleY(1);
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
        transform: translateY(53px) scaleY(1);
      }
      92% {
        opacity: 0.85;
        transform: translateY(61px) scale(1.6, 0.35);
      }
      100% {
        opacity: 0;
        transform: translateY(62px) scale(2.2, 0.1);
      }
    }
    @keyframes rain-hit-low {
      0% {
        opacity: 0;
        transform: translateY(0) scaleY(1);
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
        transform: translateY(63px) scaleY(1);
      }
      92% {
        opacity: 0.85;
        transform: translateY(72px) scale(1.6, 0.35);
      }
      100% {
        opacity: 0;
        transform: translateY(73px) scale(2.2, 0.1);
      }
    }
    @keyframes rain-fall-surround {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      15% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translateY(185px);
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="game-screen">
      <header class="header">
        <h1>
          <svg class="lucide lucide-lock inline-icon header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          КОД ДОСТУПУ
        </h1>
        <p>Введи 7-значний пароль для входу</p>
      </header>
      <div class="code-wrapper">
        <div class="code-container" id="code-container">
          <div class="char-box active" id="box-0"><span class="char-text"></span></div>
          <div class="char-box" id="box-1"><span class="char-text"></span></div>
          <div class="char-box" id="box-2"><span class="char-text"></span></div>
          <div class="char-box" id="box-3"><span class="char-text"></span></div>
          <div class="char-box" id="box-4"><span class="char-text"></span></div>
          <div class="char-box" id="box-5"><span class="char-text"></span></div>
          <div class="char-box" id="box-6"><span class="char-text"></span></div>
        </div>
        <button class="hint-btn" id="hint-btn">
          <svg class="lucide lucide-circle-help inline-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <path d="M12 17h.01"/>
          </svg>
          ПІДКАЗКА
        </button>
        <button class="hint-btn" id="second-hint-btn">
          <svg class="lucide lucide-sparkles inline-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/>
            <path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5Z"/>
