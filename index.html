<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Інфо-простір</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-white: #ffffff;
      --color-black: #000000;
      --color-pink: #ff8da1;
      --color-soft-blue: #e8f1f5;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #f3f5f8;
      color: var(--color-black);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      background-color: var(--color-white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(12px, 3vh, 28px) 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }
    .game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .game-screen.hide {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }
    .header {
      text-align: center;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      font-weight: 600;
      color: var(--color-black);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header-icon {
      color: var(--color-pink);
      width: clamp(18px, 4.5vw, 24px);
      height: clamp(18px, 4.5vw, 24px);
    }
    .header p {
      font-size: clamp(0.7rem, 2.8vw, 0.8rem);
      color: rgba(0, 0, 0, 0.4);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .code-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      flex-grow: 1;
    }
    .code-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(6px, 1.8vw, 10px);
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }
    .char-box {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background-color: var(--color-soft-blue);
      border: 1.5px solid transparent;
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .char-box.active {
      border-color: var(--color-black);
      background-color: var(--color-white);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.04);
    }
    .char-box.filled {
      border-color: var(--color-pink);
      background-color: rgba(255, 141, 161, 0.06);
    }
    .char-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      font-weight: 600;
      color: var(--color-black);
      line-height: 1;
      pointer-events: none;
      transition: opacity 0.4s ease-in-out;
    }
    .char-text.ghost-letter {
      opacity: 0.35 !important;
    }
    .hint-btn {
      background-color: transparent;
      border: 1.5px solid var(--color-pink);
      color: var(--color-pink);
      padding: clamp(12px, 2vh, 16px) clamp(32px, 8vw, 48px);
      border-radius: 30px;
      font-size: clamp(0.75rem, 3.2vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease, opacity 0.6s ease-in-out;
      margin-top: clamp(14px, 3vh, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      align-self: center;
      width: auto;
      max-width: 90%;
    }
    .hint-btn:active {
      background-color: rgba(255, 141, 161, 0.08);
      transform: scale(0.97);
    }
    #second-hint-btn {
      display: none;
      opacity: 0;
      margin-top: clamp(8px, 1.5vh, 12px);
    }
    #second-hint-btn.show-btn {
      display: flex;
      opacity: 1;
    }
    .inline-icon {
      width: 1.25em;
      height: 1.25em;
      stroke-width: 1.8;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .keyboard-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.5vh, 10px);
      flex-shrink: 0;
    }
    .keyboard-row {
      display: flex;
      gap: clamp(8px, 1.5vh, 10px);
      width: 100%;
    }
    .key-btn {
      flex: 1;
      height: clamp(44px, 6.5vh, 54px);
      background-color: var(--color-soft-blue);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--color-black);
      font-size: clamp(0.95rem, 4vw, 1.2rem);
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }
    .key-btn:active {
      transform: scale(0.95);
      background-color: var(--color-pink);
      color: var(--color-white);
    }
    .key-btn.key-highlight {
      background-color: var(--color-pink) !important;
      border-color: var(--color-pink) !important;
      color: var(--color-white) !important;
    }
    @media (hover: hover) {
      .key-btn:hover {
        background-color: rgba(0, 0, 0, 0.04);
      }
    }
    .control-key {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .clear-key {
      flex: 1;
      background-color: var(--color-white);
      color: var(--color-black);
      font-size: clamp(0.7rem, 3.2vw, 0.85rem);
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .clear-key:active {
      background-color: rgba(0, 0, 0, 0.05);
    }
    .enter-key {
      flex: 1.5;
      background-color: var(--color-pink);
      font-size: clamp(0.7rem, 3.2vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;
      text-transform: uppercase;
      border: 1.5px solid var(--color-pink);
      color: var(--color-white);
    }
    .enter-key:active {
      background-color: #e57589;
      border-color: #e57589;
    }
    .success-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--color-white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.05);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
      padding: 24px;
    }
    .success-screen.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    .success-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 600;
      color: var(--color-black);
      margin-top: clamp(24px, 5vh, 32px);
      text-align: center;
    }
    .success-subtitle {
      font-size: clamp(0.85rem, 3.8vw, 1.05rem);
      color: rgba(0, 0, 0, 0.6);
      margin-top: 12px;
      text-align: center;
      line-height: 1.6;
      max-width: 85%;
    }
    .glass-container {
      position: relative;
      width: clamp(130px, 30vh, 180px);
      height: clamp(130px, 30vh, 180px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .glass-glow {
      position: absolute;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(255, 141, 161, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse-glow 3s ease-in-out infinite;
    }
    .lucide-wine {
      width: 100%;
      height: 100%;
      max-width: 110px;
      max-height: 110px;
      z-index: 2;
      filter: drop-shadow(0 0 8px rgba(255, 141, 161, 0.25));
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .wine-liquid {
      animation: fill-and-empty 6s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes fill-and-empty {
      0% { transform: translateY(11px); }
      40% { transform: translateY(0px); }
      60% { transform: translateY(0px); }
      100% { transform: translateY(11px); }
    }
    .bubble {
      animation: float-bubble 3s infinite linear;
    }
    .bubble-1 { animation-delay: 0.8s; animation-duration: 2s; }
    .bubble-2 { animation-delay: 1.5s; animation-duration: 2.5s; }
    .bubble-3 { animation-delay: 2.2s; animation-duration: 1.8s; }
    @keyframes float-bubble {
      0% { transform: translateY(2px); opacity: 0; }
      30% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-7px); opacity: 0; }
    }
    .shake {
      animation: shake-action 0.5s ease-in-out;
    }
    .error-box {
      border-color: var(--color-red) !important;
      box-shadow: 0 0 12px rgba(184, 0, 0, 0.2) !important;
    }
    @keyframes shake-action {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-8px); }
      30%, 60%, 90% { transform: translateX(8px); }
    }
    .reset-btn {
      margin-top: clamp(24px, 5vh, 40px);
      background-color: transparent;
      border: 1px solid var(--color-pink);
      color: var(--color-pink);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .reset-btn:active {
      background-color: rgba(255, 141, 161, 0.08);
      color: var(--color-pink);
    }
    .hint-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 100;
      padding: 24px;
    }
    .hint-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .hint-content {
      background-color: var(--color-white);
      border: 1.5px solid var(--color-pink);
      border-radius: 24px;
      padding: clamp(36px, 6vh, 52px) clamp(24px, 5vw, 40px);
      width: 100%;
      max-width: 340px;
      position: relative;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
      transform: translateY(20px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hint-overlay.show .hint-content {
      transform: translateY(0);
    }
    .hint-content p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.15rem, 4.8vw, 1.4rem);
      line-height: 1.6;
      color: var(--color-black);
      font-weight: 600;
      font-style: italic;
    }
  </style>
</head>
